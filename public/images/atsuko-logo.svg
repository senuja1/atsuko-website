<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Radial Globe Gradient -->
    <radialGradient id="globeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#034d82" />
    </radialGradient>

    <!-- Outer Gold Ring Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>

    <!-- Curved Text Paths -->
    <!-- Top Arc for ATSUKO -->
    <path id="topTextArc" d="M 50,160 A 110,110 0 0,1 270,160" fill="none" />
    <!-- Bottom Arc for GAKKO -->
    <path id="bottomTextArc" d="M 270,160 A 110,110 0 0,1 50,160" fill="none" />
  </defs>

  <!-- Outer Ring Background -->
  <circle cx="160" cy="160" r="154" fill="#ffffff" stroke="url(#goldBorder)" stroke-width="6" />

  <!-- Inner Border for Globe -->
  <circle cx="160" cy="160" r="102" fill="url(#globeGrad)" stroke="#0284c7" stroke-width="2" />

  <!-- Globe Longitude and Latitude Lines -->
  <!-- Equator / parallels -->
  <ellipse cx="160" cy="160" rx="100" ry="34" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="3,3" />
  <ellipse cx="160" cy="160" rx="100" ry="68" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  <!-- Meridians -->
  <ellipse cx="160" cy="160" rx="34" ry="100" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="3,3" />
  <ellipse cx="160" cy="160" rx="68" ry="100" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  <line x1="160" y1="58" x2="160" y2="262" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" />
  <line x1="58" y1="160" x2="262" y2="160" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" />

  <!-- Continent abstract shapes in green/cyan tint -->
  <path d="M 120,95 Q 140,85 165,100 Q 180,115 170,135 Q 145,130 135,115 Z" fill="rgba(255,255,255,0.25)" />
  <path d="M 175,90 Q 210,85 220,110 Q 205,130 190,120 Z" fill="rgba(255,255,255,0.25)" />
  <path d="M 110,185 Q 130,175 145,195 Q 135,225 115,220 Z" fill="rgba(255,255,255,0.25)" />
  <path d="M 170,180 Q 210,185 205,220 Q 180,235 170,205 Z" fill="rgba(255,255,255,0.25)" />

  <!-- Center Banner Background Box -->
  <g filter="url(#shadow)">
    <rect x="25" y="132" width="270" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
    
    <!-- Sri Lanka Flag on the left (Simplified Crisp Representation) -->
    <g transform="translate(35, 139)">
      <!-- Outer Border / Yellow background -->
      <rect x="0" y="0" width="56" height="42" fill="#ffbe29" rx="2" stroke="#b45309" stroke-width="1" />
      <!-- Green and Orange stripes -->
      <rect x="4" y="4" width="7" height="34" fill="#008000" />
      <rect x="13" y="4" width="7" height="34" fill="#ea580c" />
      <!-- Maroon field -->
      <rect x="22" y="4" width="30" height="34" fill="#881337" />
      <!-- Bo leaves in corners -->
      <circle cx="25" cy="7" r="1.5" fill="#ffbe29" />
      <circle cx="49" cy="7" r="1.5" fill="#ffbe29" />
      <circle cx="25" cy="35" r="1.5" fill="#ffbe29" />
      <circle cx="49" cy="35" r="1.5" fill="#ffbe29" />
      <!-- Stylized Gold Lion holding sword -->
      <path d="M 33,26 Q 35,18 41,18 Q 44,18 43,22 Q 41,25 35,27" fill="#ffbe29" stroke="#ffbe29" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="41" cy="18" r="2.5" fill="#ffbe29" />
      <line x1="43" y1="15" x2="48" y2="12" stroke="#ffbe29" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Japanese Characters: 篤子 学校 (Atsuko Gakko) -->
    <text x="160" y="172" 
          font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Yu Gothic', sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="5"
          fill="#0f172a" 
          text-anchor="middle">篤子 学校</text>

    <!-- Japan Flag on the right -->
    <g transform="translate(229, 139)">
      <rect x="0" y="0" width="56" height="42" fill="#ffffff" rx="2" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Red Sun (Hinomaru) -->
      <circle cx="28" cy="21" r="12" fill="#bc002d" />
    </g>
  </g>

  <!-- Top Arc Text: ATSUKO -->
  <text font-family="'Inter', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#dc2626" letter-spacing="6">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      ATSUKO
    </textPath>
  </text>

  <!-- Bottom Arc Text: GAKKO -->
  <text font-family="'Inter', 'Arial Black', sans-serif" font-size="26" font-weight="900" fill="#dc2626" letter-spacing="6">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      GAKKO
    </textPath>
  </text>

  <!-- Small star accents between texts -->
  <circle cx="44" cy="160" r="4" fill="#f59e0b" />
  <circle cx="276" cy="160" r="4" fill="#f59e0b" />
</svg>
